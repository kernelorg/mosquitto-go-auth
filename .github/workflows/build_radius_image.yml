name: Build multi-arch image (Dockerfile.multiarch)

# Builds the small distroless image (Mosquitto + go-auth with the files and
# radius backends) for linux/amd64, linux/arm64 and linux/arm/v7 and publishes
# it to GitHub Packages as ghcr.io/<owner>/mosquitto-go-auth-radius.
# No QEMU is needed: Dockerfile.multiarch cross-compiles everything.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: mosquitto-go-auth-radius
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.multiarch
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance/SBOM attestations: they show up as "unknown/unknown"
          # platforms in the manifest list and confuse simple clients (RouterOS).
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build with every backend (not published, sanity check)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.multiarch
          platforms: linux/amd64
          push: false
          build-args: GO_BUILD_TAGS=
          provenance: false
          sbom: false
          cache-from: type=gha
