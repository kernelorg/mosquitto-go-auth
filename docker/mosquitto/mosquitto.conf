# Default configuration baked into the image built from Dockerfile.multiarch.
# Mount your own /mosquitto/config/conf.d to configure the plugin.
user nonroot
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

listener 1883
allow_anonymous false

include_dir /mosquitto/config/conf.d

# MQTT over WebSockets (e.g. for browser clients):
#listener 9001
#protocol websockets
